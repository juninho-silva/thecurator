name: Run Worker

on:
  schedule:
    - cron: '0 12 * * *' # todo dia meio-dia
  workflow_dispatch:

jobs:
  run-worker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0'

      - name: Restore
        run: dotnet restore

      - name: Run Worker
        run: dotnet run --project Newsletter.Worker