version: '3.9'
services:
   postgres:
      image: postgres:latest
      container_name: the-curator-postgres
      restart: always
      environment:
       - POSTGRES_USER=curatoradmin
       - POSTGRES_PASSWORD=curatorpassword
       - POSTGRES_DB=curatordb
      ports:
       - "5432:5432"
      volumes:
       - pgdata:/var/lib/postgresql/data

   api:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: the-curator-backend
      depends_on:
       - postgres 
      environment:
        ASPNETCORE_ENVIRONMENT: Development
        ConnectionStrings__Default: Host=postgres;Database=curatordb;Username=curatoradmin;Password=curatorpassword
      ports:
       - "5000:80"
volumes:
   pgdata:
